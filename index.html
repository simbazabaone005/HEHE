var STEPS=[["Floor cleaning",1],["Concrete surface grinding",1],["Liquid hardener application",1]];
var START0="2026-10-26",PER=3;
var BX=1.9,BY=13.3,BW=96.7,BH=79.8; // building rectangle on plan image (%)
var W=[34.65,11.735,28,31,28,31,28,31,28,31],H0=[37.15,22.25,23.85,18.75],RB=[0,.3642,.5824,.8162,1];
var COLS=[[5,16,9,11],[1,8,4,7],[2,13,6,10],[3,15,12,14],[18,20,17,19],[22,24,21,23],[26,28,25,27],[30,32,29,31],[34,36,33,35],[37,40,38,39]];
var TW=W.reduce(function(a,b){return a+b},0);
var ST={done:["All steps complete","var(--dn)"],late:["Overdue (final step past due)","var(--late)"],delay:["Delayed (step past due, not ticked)","var(--dl)"],ok:["On schedule / ahead","var(--ok)"],idle:["Not due yet","var(--idle)"]};
var S={ref:null,p:{}},P=[],tot=0;
try{var j=localStorage.getItem("grind-chb2a");if(j)S=JSON.parse(j)}catch(e){}
function iso(d){return d.toISOString().slice(0,10)}
function add(s,n){var d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return iso(d)}
function fmt(s){if(!s)return"";var a=s.split("-");return a[2]+"/"+a[1]}
function fmtl(s){var a=s.split("-");return a[2]+"/"+a[1]+"/"+a[0]}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function save(){try{localStorage.setItem("grind-chb2a",JSON.stringify(S))}catch(e){}}
var DB=null,RO=false,cur=null,chain={},FB_URL=""; // FB_URL: paste Firebase Realtime Database URL here when hosting outside claude.ai
function setSync(t){var e=document.getElementById("sync");if(e)e.textContent=t}
function applyR(id,v){if(!v||!v.start)return;S.p[id]={start:v.start,done:[0,1,2].map(function(i){return(v.d&&v.d[i])||null})}}
function push(p){if((!DB&&!FB_URL)||RO)return;var o=pd(p),id=p.id,body={start:o.start,d:o.done.map(function(x){return x||""})};
 chain[id]=(chain[id]||Promise.resolve()).then(function(){return DB?DB.doc("panels/"+id).set(body):fetch(FB_URL+"/panels/"+id+".json",{method:"PUT",body:JSON.stringify(body)})}).catch(function(){setSync("Sync error · saved on this device")})}
function refresh(){render();if(cur&&document.getElementById("m").classList.contains("on"))open(cur)}
function pull(){fetch(FB_URL+"/panels.json").then(function(r){return r.json()}).then(function(j){if(j)Object.keys(j).forEach(function(k){applyR(+k,j[k])});save();refresh();setSync("Online · Firebase")}).catch(function(){setSync("Offline · this device only")})}
function fbStart(){if(FB_URL){pull();setInterval(pull,20000)}}
function online(){if(!(window.claude&&claude.use))return fbStart();
 claude.use("db").then(function(db){if(!db)return fbStart();
  return claude.use("user").then(function(u){return Promise.resolve(u?u.can("data.write"):null)}).then(function(w){RO=(w===false);DB=db;setSync(RO?"Online · read-only":"Online · shared with team");
   db.collection("panels").onSnapshot(function(s){s.docs.forEach(function(d){applyR(+d.id,d.data())});save();if(!s.metadata.hasPendingWrites)refresh()},function(){DB=null;setSync("Offline · this device only")})})}).catch(function(){fbStart()})}
function ref(){return S.ref||today()}
var x=BX;
COLS.forEach(function(c,i){var w=W[i]/TW*BW,rb=i==0?RB:[0,.25,.5,.75,1],hh=i==0?H0:[25,25,25,25];
 c.forEach(function(id,r){P.push({id:id,l:x,t:BY+rb[r]*BH,w:w,h:(rb[r+1]-rb[r])*BH,area:Math.round(W[i]*hh[r])});tot+=Math.round(W[i]*hh[r])});x+=w});
P.sort(function(a,b){return a.id-b.id});
function pd(p){var o=S.p[p.id]||(S.p[p.id]={});if(!o.start)o.start=add(START0,(p.id-1)*PER);if(!o.done)o.done=[null,null,null];return o}
function dues(p){var o=pd(p),a=[],n=0;STEPS.forEach(function(s,i){n+=s[1];a.push(add(o.start,n-1))});return a}
function status(p){var o=pd(p),d=dues(p),r=ref(),dn=o.done.filter(Boolean).length;
 if(dn==3)return"done";
 var late=d.some(function(u,i){return!o.done[i]&&u<r});
 if(late)return d[2]<r?"late":"delay";
 return dn>0?"ok":"idle"}
function render(){var r=ref(),pl=document.getElementById("plan");
 pl.querySelectorAll(".p").forEach(function(e){e.remove()});
 var cnt={done:0,late:0,delay:0,ok:0,idle:0},steps=0,ar=0;
 P.forEach(function(p){var o=pd(p),s=status(p),dn=o.done.filter(Boolean).length;cnt[s]++;steps+=dn;if(s=="done")ar+=p.area;
  var b=document.createElement("button");b.className="p";b.style.cssText="left:"+p.l+"%;top:"+p.t+"%;width:"+p.w+"%;height:"+p.h+"%;--c:"+ST[s][1];
  b.setAttribute("aria-label","Panel "+p.id+", "+ST[s][0]);
  b.innerHTML='<span class="n">'+p.id+'</span><span class="a">'+p.area+' m²</span><span class="d">'+fmt(o.start)+'–'+fmt(dues(p)[2])+'</span><span class="pr">'+dn+'/3</span>';
  b.onclick=function(){open(p)};pl.appendChild(b)});
 document.getElementById("rl").textContent=fmtl(r);document.getElementById("ref").value=r;
 document.getElementById("kpi").innerHTML=k(cnt.done+"/40","Panels complete")+k(steps+"/120","Steps ticked")+k((ar/tot*100).toFixed(1)+"%","Area complete")+k(cnt.late+cnt.delay,"Panels behind");
 document.getElementById("lg").innerHTML=Object.keys(ST).map(function(q){return'<span><i style="background:'+ST[q][1]+'"></i>'+ST[q][0]+'<em>'+cnt[q]+'</em></span>'}).join("")}
function k(a,b){return'<div class="k"><b>'+a+'</b><span>'+b+'</span></div>'}
function open(p){cur=p;var o=pd(p),d=dues(p),r=ref();
 var h='<h2>Panel '+p.id+'</h2><div class="mu">'+p.area+' m² · 3 working steps · 1 day each</div><div class="fl"><label for="sd">Start date</label><input type="date" id="sd" value="'+o.start+'"'+(RO?" disabled":"")+'></div>';
 STEPS.forEach(function(s,i){var od=!o.done[i]&&d[i]<r;
  h+='<label class="row '+(o.done[i]?"ok":od?"od":"")+'"><input type="checkbox" data-i="'+i+'"'+(o.done[i]?" checked":"")+(RO?" disabled":"")+'><div>'+(i+1)+'. '+s[0]+'<small>Due '+fmtl(d[i])+(o.done[i]?' · ticked '+fmtl(o.done[i]):od?' · overdue':'')+'</small></div></label>'});
 h+='<div class="ctl" style="justify-content:flex-end;margin-top:12px"><button class="pri" id="cl">Close</button></div>';
 var bx=document.getElementById("bx");bx.innerHTML=h;document.getElementById("m").classList.add("on");
 document.getElementById("sd").onchange=function(){if(this.value){o.start=this.value;save();push(p);render();open(p)}};
 bx.querySelectorAll("input[type=checkbox]").forEach(function(c){c.onchange=function(){var i=+c.dataset.i;o.done[i]=c.checked?r:null;save();push(p);render();open(p)}});
 document.getElementById("cl").onclick=function(){document.getElementById("m").classList.remove("on")}}
document.getElementById("m").onclick=function(e){if(e.target==this)this.classList.remove("on")};
document.addEventListener("keydown",function(e){if(e.key=="Escape")document.getElementById("m").classList.remove("on")});
document.getElementById("ref").onchange=function(){S.ref=this.value||null;save();render()};
document.getElementById("td").onclick=function(){S.ref=null;save();render()};
document.getElementById("pr").onclick=function(){window.print()};
setTimeout(online,0);
if(window.claude&&claude.use)claude.use("downloads").then(function(dl){if(!dl)return;var b=document.getElementById("bk");b.hidden=false;b.onclick=function(){dl.save({filename:"grinding-backup-"+ref()+".json",data:JSON.stringify(S,null,1)}).catch(function(){})}}).catch(function(){});
render();
</script></body></html>
